<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111111">
    <title>your name</title>
    <link rel="stylesheet" href="./editor.css">
    <script src="./editor.js" type="module"></script>
  </head>
  <body>
    <header class="toolbar">
      <input id="site-title" type="text" aria-label="Page name and browser tab title" placeholder="tab title" maxlength="120">
      <button id="save" type="button" disabled>save &amp; push</button>
      <button id="open-versions" type="button">versions</button>
      <span id="status" role="status" aria-live="polite"></span>
    </header>
    <iframe id="site" src="./preview/" title="Edit your site"></iframe>
    <dialog id="versions-dialog">
      <section class="versions">
        <h2>Versions</h2>
        <ol id="version-list" class="version-list"></ol>
        <div class="actions">
          <button id="close-versions" type="button">close</button>
        </div>
      </section>
    </dialog>
  </body>
</html>
